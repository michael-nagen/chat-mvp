services:
  mongo:
    image: mongo:7
    container_name: chat-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Self-initiating single-node replica set: the healthcheck runs rs.initiate()
    # once (and is a no-op afterwards), so transactions work without a manual step.
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
          }
        "
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 10

volumes:
  mongo-data:
